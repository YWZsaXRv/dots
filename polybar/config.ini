; polybar com cara de windows 95

[colors]
background     = #c0c0c0
foreground     = #000000
titlebar       = #000080
titlebar-text  = #ffffff
shadow         = #808080
red            = #ff0000

[bar/bar1]
width          = 100%
height         = 28
fixed-center   = true

background     = ${colors.background}
foreground     = ${colors.foreground}

; borda dupla da barra de titulo
border-size    = 2
border-color   = ${colors.shadow}

padding-left   = 2
padding-right  = 2
module-margin  = 0

font-0         = JetBrainsMonoNerdFontPropo;2

modules-left   = custom-menu sep xwindow
modules-center = xworkspaces
modules-right  = cpu sep memory sep filesystem sep date sep tray-toggle tray-open systray tray-close

cursor-click   = pointer
cursor-scroll  = ns-resize

enable-ipc     = true

[settings]
screenchange-reload = true
pseudo-transparency = false

[module/custom-menu]
type             = custom/text
format           = [Arch]
format-foreground = ${colors.titlebar}
format-font      = 1

click-left       = "rofi -show run"
click-right      = "${HOME}/.config/i3/scripts/powermenu.sh"

; mostra o app, nao a janela. yazi e coisas assim rodam dentro do terminal
[module/xwindow]
type             = custom/script
exec             = ${HOME}/.config/polybar/active-app.sh
interval         = 1
label            = [%output%]

[module/xworkspaces]
type             = internal/xworkspaces

label-active         = %name%
label-active-background  = ${colors.titlebar}
label-active-foreground  = ${colors.titlebar-text}
label-active-padding     = 1

label-occupied         = %name%
label-occupied-background   = ${colors.shadow}
label-occupied-padding      = 1

label-urgent         = %name%
label-urgent-background   = ${colors.red}
label-urgent-foreground   = ${colors.titlebar-text}
label-urgent-padding      = 1

label-empty          = %name%
label-empty-padding      = 1

[module/cpu]
type             = internal/cpu
interval         = 2
label            = [CPU %percentage%%]

[module/memory]
type             = internal/memory
interval         = 2
label            = [RAM %percentage_used%%]

[module/filesystem]
type             = internal/fs
interval         = 25
mount-0          = /
label-mounted    = [SSD %percentage_used%%]

[module/date]
type             = internal/date
interval         = 1
date             = %d/%m/%Y
time             = %H:%M
date-alt         = %A, %d de %B de %Y
time-alt         = %H:%M:%S
label            = [%date% | %time%]

[module/sep]
type             = custom/text
format           =  |
format-foreground = ${colors.shadow}
format-padding   = 1

; o colchete abre junto com os icones, entao os tres somem e voltam juntos
[module/tray-open]
type             = custom/text
format           = [

[module/tray-close]
type             = custom/text
format           = ]

; seta aponta pro lado que o bloco abre
[module/tray-toggle]
type             = custom/script
exec             = ${HOME}/.config/polybar/tray-icon.sh
interval         = 1

click-left       = "${HOME}/.config/polybar/tray-toggle.sh"

[module/systray]
type             = internal/tray
format-margin    = 8pt
tray-spacing     = 16pt
